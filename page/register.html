<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - SoulScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="../style.css" rel="stylesheet"/>
</head>
<body>

  <div class="wrap">

    <aside class="brand">
      <div class="brandMark">
        <h2>SoulScript</h2>
      </div>

      <div class="brandQuote">
        <p class="brandLines">
            Every Words Has A Meaning
        </p>
      </div>

    </aside>

    <main class="panel">
      <div class="panelInner">

        <header class="panelHead">
          <h1>Buat akun SoulScript</h1>
        </header>

        <form class="form" action="#" method="post">

          <div class="field">
            <input type="text" id="nama" name="nama" placeholder="nama lengkap" required>
          </div>

          <div class="field">
            <input type="text" id="username" name="username" placeholder="username" required>
          </div>

          <div class="field">
            <input type="password" id="password" name="password" placeholder="password" required>
          </div>

          <div class="field">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="konfirmasi password" required>
          </div>

          <button type="submit" class="btn">Daftar</button>

        </form>

        <p class="panel__foot">
          Sudah punya akun? <a href="login.html" class="link link--strong">Masuk</a>
        </p>

      </div>
    </main>

  </div>
<script>
const formContainer = document.querySelector('.form');

formContainer.addEventListener('submit', async(event) => {
  event.preventDefault();

  const nama = document.getElementById('nama').value;
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    alert('Password dan konfirmasi password tidak sama');
    return;
  }

  try{
    const response = await fetch('http://localhost:3000/register', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      credentials: 'include',
      body: JSON.stringify({ nama, username, password }),
    })

    const data = await response.json()

    if(response.ok){
      alert('Registrasi berhasil! Silakan login.');
      window.location.href = "login.html"
    } else {
      alert(data.message || 'Registrasi gagal');
    }
  }catch(err){
    console.error(err);
    alert('Gagal terhubung ke server. Cek apakah backend jalan.');
  }
})
</script>
</body>
</html>
